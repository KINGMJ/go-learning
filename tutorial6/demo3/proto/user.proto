syntax = "proto3"; // 指定版本信息，不指定会报错，默认是 proto2

option go_package = "./pb;pb";  // 指定包名，分号前面的表示生成的文件路径；分号后面表示生成的go文件的包名

// 定义结构体
message UserRequest {
    string name = 1;
}

// 响应结构体
message UserResponse {
    int32 id = 1;
    string name = 2;
    int32 age = 3;
    // repeated修饰符是可变数组，golang中会生成string类型的切片
    repeated string hobby = 4;
}

// service 定义方法
service UserInfoService {
    rpc GetUserInfo (UserRequest) returns (UserResponse);
}

message LogStreamReq {
    int32 log_level = 1;
}

message LogStreamRes {
    int32 log_level = 1;
    string log_message = 2;
}

// 服务端流式 rpc，模拟一个服务端实时推送日志信息
service LogStreamService {
    rpc GetStreamLogs(LogStreamReq) returns (stream LogStreamRes);
}

// 客户端流式 rpc 实现大文件上传

message FileChunk {
    bytes data = 1;
}

message UploadStatus {
    bool success = 1;
}

service FileService {
    rpc UploadFile (stream FileChunk) returns (UploadStatus);
}


// 双向流 rpc 实现聊天应用
message Message {
    string sender = 1;
    string text = 2;
}

service ChatService {
    rpc Chat(stream Message) returns (stream Message);
}